# Creates/updates a release PR on every push to main.
# The PR bumps package.json version and updates CHANGELOG.md based on changesets.
#
# Trains carrying mobile changes are versioned X.Y.Z-rc.N (see
# scripts/prepare-release.ts); once a candidate has shipped to the stores, the
# Finalize Release workflow regenerates the PR as the final stable release.
name: Prepare Release

on:
  push:
    branches: [main]
  # Regenerating on demand is the way back after closing a final cut: the guard
  # in prepare-release.ts clears when that PR closes, but the release branch
  # still holds the graduation until a run overwrites it.
  workflow_dispatch:

# Shared with the other release workflows: two pushes in quick succession would
# otherwise race to force-push the release branch, and a prepare must not run
# while a publish is mid-flight and versions disagree with tags.
concurrency:
  group: release-train
  cancel-in-progress: false

jobs:
  prepare-release:
    # Matches the subject only. head_commit.message carries the body too, so
    # contains() skipped this job for any commit that merely quoted a release
    # subject while explaining something. A dispatch has no head_commit, so it is
    # allowed explicitly rather than relying on coercion of a missing value.
    if: "${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: release') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # A PAT, not GITHUB_TOKEN: pushes and pull requests attributed to the
          # workflow token are gated behind "approve workflows to run", so the
          # release PR's required checks never report and it cannot merge.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config user.email github-actions[bot]@users.noreply.github.com

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Knope
        uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.22.2

      - name: Prepare Release
        run: bun scripts/prepare-release.ts
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        continue-on-error: true
