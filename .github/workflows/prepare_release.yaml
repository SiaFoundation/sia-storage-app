# Creates/updates a release PR on every push to main.
# The PR bumps package.json version and updates CHANGELOG.md based on changesets.
#
# Trains carrying mobile or desktop changes are versioned X.Y.Z-rc.N (see
# scripts/prepare-release.ts); once a candidate has been tested, the Finalize
# Release workflow regenerates the PR as the final stable release. A mobile
# candidate's release commit also carries its release notes, which
# prepare-release.ts writes with Copilot (apps/mobile/scripts/writeReleaseNotes.ts).
name: Prepare Release

on:
  push:
    branches: [main]
  # Regenerating on demand is the way back after closing a final cut: the guard
  # in prepare-release.ts clears when that PR closes, but the release branch
  # still holds the graduation until a run overwrites it.
  workflow_dispatch:

jobs:
  prepare-release:
    # Matches the subject only. head_commit.message carries the body too, so
    # contains() skipped this job for any commit that merely quoted a release
    # subject while explaining something. A dispatch has no head_commit, so it is
    # allowed explicitly rather than relying on coercion of a missing value.
    if: "${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: release') }}"
    # Shared with the other release workflows: two pushes in quick succession
    # would otherwise race to force-push the release branch, and a prepare must
    # not run while a publish is mid-flight and versions disagree with tags.
    # Set on the job rather than the workflow so the run a release PR's own
    # merge starts, which the `if` skips, never joins the group. A group holds
    # one waiting run and a newcomer cancels it, so that skipped run could
    # cancel the Publish Release run waiting behind another job.
    concurrency:
      group: release-train
      cancel-in-progress: false
    permissions:
      contents: read
      # Lets the workflow token call Copilot, billed to the organization, for
      # the mobile release notes.
      copilot-requests: write
    runs-on: ubuntu-latest
    steps:
      # An app token: pushes made with GITHUB_TOKEN don't trigger workflows,
      # so the release PR's checks never run and it can't merge.
      - name: Mint bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SIA_CI_BOT_APP_ID }}
          private-key: ${{ secrets.SIA_CI_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # prepare-release.ts force-pushes the release branch later in the
          # run, using the credentials that checkout saves here.
          token: ${{ steps.bot-token.outputs.token }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config user.email github-actions[bot]@users.noreply.github.com

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Knope
        uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.22.2

      - name: Prepare Release
        run: bun scripts/prepare-release.ts
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true
