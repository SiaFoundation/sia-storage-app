# The manual step of a mobile release: run after the chosen release candidate has
# shipped to the stores. Regenerates the release PR as the stable version
# (X.Y.Z-rc.N becomes X.Y.Z) and records which candidate it graduated. Merging it
# brings main's versions and changelogs forward, and Publish Release then tags
# the candidate's own commit, so the stable tag names the source that shipped
# rather than main's tip. Safe to run after newer changes have merged: it
# finalizes from the shipped candidate's tag, and the newer work starts the next
# train. While the PR it opens is unmerged, Prepare Release leaves the release
# branch alone, so a push to main can no longer replace the graduation with an rc.
# Gated apps promote together: every app ships the same cut before finalizing.
name: Finalize Release

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "Tag of the cut that shipped, named by any gated app's tag (e.g. mobile/v1.14.0-rc.3); defaults to the latest cut"
        required: false
        type: string

concurrency:
  group: release-train
  cancel-in-progress: false

jobs:
  finalize-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # A PAT, not GITHUB_TOKEN: pushes and pull requests attributed to the
          # workflow token are gated behind "approve workflows to run", so the
          # release PR's required checks never report and it cannot merge.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config user.email github-actions[bot]@users.noreply.github.com

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Knope
        uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.22.2

      - name: Prepare Final Release
        run: bun scripts/prepare-release.ts
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_MODE: final
          SHIPPED_CANDIDATE: ${{ inputs.candidate }}
