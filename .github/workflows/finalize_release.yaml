# The manual step of a mobile release: run after the chosen release candidate has
# shipped to the stores. Regenerates the release PR as the stable version
# (X.Y.Z-rc.N becomes X.Y.Z); merging it creates the stable GitHub release, which
# builds nothing (the store submission is the tested candidate) and triggers the
# release announcement. Safe to run after newer changes have merged: it finalizes
# from the shipped candidate's tag, and the newer work starts the next train.
# Gated apps promote together: every app ships the same cut before finalizing.
name: Finalize Release

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Tag of the cut that shipped, named by any gated app''s tag (e.g. mobile/v1.14.0-rc.3); defaults to the latest cut'
        required: false
        type: string

jobs:
  finalize-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config user.email github-actions[bot]@users.noreply.github.com

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Knope
        uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.22.2

      - name: Prepare Final Release
        run: bun scripts/prepare-release.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: final
          SHIPPED_CANDIDATE: ${{ inputs.candidate }}
