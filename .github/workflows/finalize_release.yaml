# The manual step of a mobile or desktop release: run it with the app once one
# of its candidates has been tested.
#
# Mobile: submits the candidate's build to App Store and Google Play review
# with the What's New it carries (release-stores.yml), then opens the final PR
# as a draft. Store Review marks it ready once both stores approve, and merges
# it once both have the build live.
#
# Desktop: opens the final PR and merges it.
#
# Merging a final PR tags X.Y.Z on the candidate's commit (Publish Release).
# Run this again after a fixed candidate merges, and the stores and the final
# PR take the new one. RELEASING.md has the whole flow.
name: Finalize Release

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to finalize'
        required: true
        type: choice
        options: [mobile, desktop]
      candidate:
        description: 'Candidate tag (e.g. mobile/v1.15.1-rc.3). Defaults to the newest one on main'
        required: false
        type: string

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve the candidate
        id: tag
        env:
          APP: ${{ inputs.app }}
          NAMED: ${{ inputs.candidate }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$NAMED" ]; then
            tag="$NAMED"
          else
            version=$(gh api "repos/$GITHUB_REPOSITORY/contents/apps/$APP/package.json?ref=main" --jq '.content' | base64 -d | jq -r .version)
            tag="$APP/v$version"
          fi
          if ! [[ "$tag" =~ ^$APP/v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "$tag is not a $APP candidate. Name one, such as $APP/v1.2.3-rc.0" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "finalizing $tag"

  submit:
    needs: candidate
    if: ${{ inputs.app == 'mobile' }}
    uses: ./.github/workflows/release-stores.yml
    with:
      candidate: ${{ needs.candidate.outputs.tag }}
    secrets:
      APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY_JSON }}

  final-pr:
    needs: [candidate, submit]
    # Runs after a successful submission, or straight away for desktop.
    if: ${{ !cancelled() && needs.candidate.result == 'success' && (needs.submit.result == 'success' || needs.submit.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Its own group, since a waiting run in a shared one can be cancelled by a
    # newer arrival. The other release PRs are rebuilt by the Prepare Release
    # run this starts at the end.
    concurrency:
      group: finalize-${{ inputs.app }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      # An app token: pushes made with GITHUB_TOKEN don't trigger workflows,
      # so the release PR's checks never run and it can't merge.
      - name: Mint bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SIA_CI_BOT_APP_ID }}
          private-key: ${{ secrets.SIA_CI_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          # prepare-release.ts force-pushes the release branches later in the
          # run, using the credentials that checkout saves here.
          token: ${{ steps.bot-token.outputs.token }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config user.email github-actions[bot]@users.noreply.github.com

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Knope
        uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.22.2

      - name: Open the final PR
        run: bun scripts/prepare-release.ts
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
          RELEASE_MODE: final
          RELEASE_APP: ${{ inputs.app }}
          SHIPPED_CANDIDATE: ${{ needs.candidate.outputs.tag }}

      # A desktop final has no store to wait for. A merge GitHub refuses leaves
      # the PR ready for someone to merge.
      - name: Merge the desktop final
        if: ${{ inputs.app == 'desktop' }}
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: gh pr merge release/desktop-final --rebase || echo "::warning::the desktop final is ready but didn't merge"

      # The candidate PR keeps the final's version while it is open.
      - name: Rebuild the other release PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run prepare_release.yaml --ref main
