name: PR

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

# cancel previous runs when the PR is updated
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: bun run lint
      - run: bun run check-changesets

  knip:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: bun run knip

  typecheck:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: bun run typecheck

  test-core:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: bun --cwd packages/core test

  test-mock-network:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: bun --cwd packages/mock-network test

  test-sim:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: bun --cwd apps/sim test

  test-mobile:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: bun --cwd apps/mobile test

  # The import-sources Swift logic. A standalone SwiftPM package, so this needs
  # no prebuild and no simulator. The simulator tier (Photos-framework behavior)
  # stays local: see `mobile:test:native:ios:sim`.
  test-native-ios:
    runs-on: macos-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: bun run mobile:test:native:ios

  # The Kotlin half. Unlike iOS this needs a prebuild first, because
  # apps/mobile/android is generated and gitignored, and gradle autolinking
  # resolves the module through it.
  test-native-android:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - run: bunx expo prebuild -p android --no-install
        working-directory: apps/mobile
      - run: bun run mobile:test:native:android

  test-integration:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: bun --cwd apps/integration test

  test-cli:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: bun --cwd apps/cli test

  test-cli-e2e:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: bun --cwd apps/cli test:e2e

  sim:
    # Real CLI daemons as separate devices over the shared mock network. Each
    # scenario gets its own network and devices, so four run at once. The
    # phone scenarios need simulators and run in sim-mobile.yml.
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: bun sim run sync/ resilience/ finder/ --jobs 4
      # The reports, and the kept session of every scenario that did not pass.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sim-runs
          path: |
            /tmp/sia-sim/runs
            /tmp/sia-sim/run-*
          retention-days: 7

  # Main's branch rule requires the sim/ios, sim/android and sim/desktop
  # statuses on a PR's head commit. Only the release PR needs a phone run,
  # and a desktop run only when it changes the desktop version, so this job
  # posts every other status as passed. A pending one waits for sim-mobile.yml
  # on a PR labelled sim-mobile, or `bun sim attest`, to test that commit.
  sim-status:
    runs-on: ubuntu-latest
    # A fork's token cannot post statuses, so a fork PR gets none from here.
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      statuses: write
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE: ${{ github.head_ref == 'release' }}
        run: |
          post() {
            gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
              -f state="$2" -f context="sim/$1" -f description="$3" > /dev/null
          }
          desktop_version() {
            gh api "repos/$GITHUB_REPOSITORY/contents/apps/desktop/package.json?ref=$1" \
              -H 'Accept: application/vnd.github.raw+json' | jq -r .version
          }
          if [ "$RELEASE" != true ]; then
            for platform in ios android desktop; do post "$platform" success 'Not required for this PR'; done
            exit 0
          fi
          post ios pending 'Waiting for a sim run: add the sim-mobile label or run bun sim attest ios'
          post android pending 'Waiting for a sim run: add the sim-mobile label or run bun sim attest android'
          base=$(desktop_version "$BASE_SHA")
          head=$(desktop_version "$HEAD_SHA")
          if [ "$base" != "$head" ]; then
            post desktop pending "Waiting for bun sim attest desktop, for desktop $head"
          else
            post desktop success 'Not required: no desktop release in this PR'
          fi

  build-cli:
    # Smoke-test the CLI compile on the cheapest runner. Per-platform builds
    # are reserved for the release workflow — PRs only need to catch obvious
    # source-level breakage, not platform-specific bugs.
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - working-directory: apps/cli
        run: bun run build:linux-x64
