name: PR

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

# cancel previous runs when the PR is updated
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: bun run lint
      - run: bun run check-changesets

  knip:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: bun run knip

  typecheck:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: bun run typecheck

  test-core:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: bun --cwd packages/core test

  test-mock-network:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: bun --cwd packages/mock-network test

  test-sim:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: bun --cwd apps/sim test

  test-mobile:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: bun --cwd apps/mobile test

  # The import-sources Swift logic. A standalone SwiftPM package, so this needs
  # no prebuild and no simulator. The simulator tier (Photos-framework behavior)
  # runs in sim-ios.yml, with the phone suites.
  test-native-ios:
    runs-on: macos-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: bun run mobile:test:native:ios

  # The Kotlin half. Unlike iOS this needs a prebuild first, because
  # apps/mobile/android is generated and gitignored, and gradle autolinking
  # resolves the module through it.
  test-native-android:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - run: bunx expo prebuild -p android --no-install
        working-directory: apps/mobile
      - run: bun run mobile:test:native:android

  test-integration:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: bun --cwd apps/integration test

  # Times the core's database calls on this PR against its base commit on the
  # same runner, and checks their statement counts and query plans against
  # apps/benchmark/baseline. Posts the result as one PR comment that later
  # runs edit. Skipped when the PR touches nothing those calls run.
  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      # A PR checks out its merge commit, whose first parent is the base
      # branch as it stands, so HEAD^1 is exactly what the PR changes.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - id: changes
        shell: bash
        run: |
          if git diff --quiet HEAD^1 HEAD -- packages/core packages/node-adapters packages/logger apps/benchmark bun.lock .node-version; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/setup
      - if: steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
          cd "$RUNNER_TEMP/base" && bun install --frozen-lockfile
      - if: steps.changes.outputs.run == 'true'
        run: bun run --cwd apps/benchmark test
      - if: steps.changes.outputs.run == 'true'
        run: bun run --cwd apps/benchmark bench:ci --base "$RUNNER_TEMP/base"
      # A fork's token cannot comment, so a fork PR gets the job summary only.
      - if: >-
          always() && steps.changes.outputs.run == 'true' &&
          hashFiles('apps/benchmark/results/ci/comment.md') != '' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bun run --cwd apps/benchmark bench:comment results/ci/comment.md
      # report.json from a run whose two sides ran the same core is a
      # calibration sample for bench:calibrate.
      - if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark
          path: apps/benchmark/results/ci
          retention-days: 30

  test-cli:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: bun --cwd apps/cli test

  test-cli-e2e:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: bun --cwd apps/cli test:e2e

  sim:
    # Real CLI daemons as separate devices over the shared mock network. Each
    # scenario gets its own network and devices, so four run at once. The
    # phone scenarios need simulators and run in sim-ios.yml and sim-android.yml.
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: bun sim run sync/ resilience/ finder/ --jobs 4
      # The reports, and the kept session of every scenario that did not pass.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sim-runs
          path: |
            /tmp/sia-sim/runs
            /tmp/sia-sim/run-*
          retention-days: 7

  # Each platform the apps run on has a sim/<platform> status: ios, android
  # and macos. On the release PR this job leaves them pending until sim.yml
  # on a PR labelled sim, or `bun sim attest <platform>`, posts a result for
  # that commit. On any other PR it posts them as passed, so a rule requiring
  # them holds back only the release PR.
  sim-status:
    runs-on: ubuntu-latest
    # A fork's token cannot post statuses, so a fork PR gets none from here.
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      statuses: write
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE: ${{ github.head_ref == 'release' }}
        run: |
          # A status already on this commit stays, other than the placeholder
          # below, so reopening the release PR or running this workflow again
          # does not put a posted result back to pending.
          posted=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/status" \
            --jq '.statuses[] | select(.description != "Not required for this PR") | .context')
          for platform in ios android macos; do
            if [ "$RELEASE" = true ]; then
              grep -qx "sim/$platform" <<< "$posted" && continue
              state=pending description="Waiting for a sim run: add the sim label or run bun sim attest $platform"
            else
              state=success description='Not required for this PR'
            fi
            gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
              -f state="$state" -f context="sim/$platform" -f description="$description" > /dev/null
          done

  build-cli:
    # Smoke-test the CLI compile on the cheapest runner. Per-platform builds
    # are reserved for the release workflow — PRs only need to catch obvious
    # source-level breakage, not platform-specific bugs.
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - working-directory: apps/cli
        run: bun run build:linux-x64
